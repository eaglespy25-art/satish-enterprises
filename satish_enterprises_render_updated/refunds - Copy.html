<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Satish Enterprises — Payments & Refunds</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f5f6fa;color:#20232a}.top{background:#171923;color:#fff;padding:18px 25px;font-size:21px;font-weight:800}.top b{color:#f5a623}.wrap{max-width:1200px;margin:25px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.box{background:#fff;border:1px solid #e4e6eb;border-radius:13px;padding:18px;margin-bottom:18px}.label{color:#737887;font-size:12px}.num{font-size:25px;font-weight:800;margin-top:6px}.table{overflow:auto}.row{display:grid;grid-template-columns:110px 150px 1fr 100px 110px 120px;gap:8px;padding:12px 0;border-bottom:1px solid #eee;min-width:780px;align-items:center}.head{font-size:11px;color:#737887;font-weight:800}.badge{padding:5px 8px;border-radius:18px;font-size:11px;background:#eef0f4}.green{background:#e2f7ea;color:#17733e}.yellow{background:#fff2cc;color:#8a6500}.red{background:#ffe1e1;color:#a01f1f}.btn{padding:8px 10px;border:0;border-radius:7px;background:#171923;color:#fff;cursor:pointer}.muted{color:#737887}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="top">SATISH <b>ENTERPRISES</b> — Payments & Refunds</div><div class="wrap">
<div class="cards"><div class="card"><div class="label">Payments</div><div class="num" id="payments">0</div></div><div class="card"><div class="label">Paid</div><div class="num" id="paid">₹0</div></div><div class="card"><div class="label">Refunds</div><div class="num" id="refunds">0</div></div><div class="card"><div class="label">Refunded</div><div class="num" id="refunded">₹0</div></div></div>
<div class="box"><h2>Payment Ledger</h2><div class="table" id="paymentList"></div></div>
<div class="box"><h2>Return / Refund Queue</h2><div class="table" id="refundList"></div></div>
</div><script>
const API=localStorage.getItem('se_api')||'http://localhost:4000',token=localStorage.getItem('se_token')||'';
const H={Authorization:'Bearer '+token,'Content-Type':'application/json'};
async function get(p){let r=await fetch(API+p,{headers:H}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){try{let ps=await get('/api/admin/payments'),rs=await get('/api/admin/returns'),fs=await get('/api/admin/refunds');
payments.innerText=ps.length;paid.innerText='₹'+ps.filter(x=>x.status==='verified'||x.status==='captured').reduce((a,x)=>a+x.amount,0).toLocaleString('en-IN');refunds.innerText=fs.length;refunded.innerText='₹'+fs.filter(x=>x.status==='processed').reduce((a,x)=>a+x.amount,0).toLocaleString('en-IN');
paymentList.innerHTML='<div class="row head"><span>Payment</span><span>Order</span><span>Customer</span><span>Amount</span><span>Status</span><span>Refund</span></div>'+ps.map(x=>`<div class="row"><span>${x.payment_id||'—'}</span><span>${x.order_number}</span><span>${x.customer_name}<br><small>${x.email}</small></span><span>₹${x.amount}</span><span class="badge">${x.status}</span><span>—</span></div>`).join('');
refundList.innerHTML='<div class="row head"><span>Return</span><span>Order</span><span>Customer</span><span>Amount</span><span>Status</span><span>Action</span></div>'+rs.map(x=>`<div class="row"><span>#${x.id}</span><span>${x.order_number}</span><span>${x.customer_name}</span><span>₹${x.quantity*x.unit_price||'—'}</span><span class="badge">${x.refund_status}</span><span>${x.status==='approved'&&x.refund_status==='pending'?`<button class="btn" onclick="refund(${x.id})">Refund</button>`:'—'}</span></div>`).join('');
}catch(e){paymentList.innerHTML='<p class="muted">'+e.message+'</p>'}}
async function refund(id){if(!confirm('Create this Razorpay refund?'))return;try{let r=await fetch(API+'/api/admin/returns/'+id+'/refund',{method:'POST',headers:H}),d=await r.json();if(!r.ok)throw Error(d.error||'Refund failed');alert('Refund created: '+d.refund_id);load()}catch(e){alert(e.message)}}
load();
</script></body></html>
